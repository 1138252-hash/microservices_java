spring.application.name=currency-api
server.port=8100

spring.datasource.url=jdbc:postgresql://localhost/db_currency
spring.datasource.username=postgres
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

spring.cloud.consul.host=localhost
spring.cloud.consul.port=8500

spring.config.import=optional:consul:
# Data fixa em dia util com cotacao historica (formato MM-dd-yyyy)
bcb.ptax.date=10-14-2025
bcb.ptax.base-url=https://olinda.bcb.gov.br/olinda/servico/PTAX/versao/v1/odata

spring.cache.type=caffeine
spring.cache.cache-names=bcb-ptax
spring.cache.caffeine.spec=maximumSize=1000,expireAfterWrite=10m

resilience4j.retry.instances.bcb.max-attempts=3
resilience4j.retry.instances.bcb.wait-duration=1s
resilience4j.retry.instances.bcb.ignore-exceptions[0]=io.github.resilience4j.circuitbreaker.CallNotPermittedException

resilience4j.circuitbreaker.instances.bcb.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.bcb.sliding-window-size=5
resilience4j.circuitbreaker.instances.bcb.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.bcb.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.bcb.wait-duration-in-open-state=100s
